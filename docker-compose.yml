version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=tfrenzy_doc_db
      - POSTGRES_USER=tfrenzy_user
      - POSTGRES_PASSWORD=securepassword
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    restart: always

  postgres:
    image: postgres:15-alpine
    container_name: tfrenzy_postgres
    environment:
      POSTGRES_DB: tfrenzy_doc_db
      POSTGRES_USER: tfrenzy_user
      POSTGRES_PASSWORD: securepassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  redis:
    image: redis:7-alpine
    container_name: tfrenzy_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  pgdata:
